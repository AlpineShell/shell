name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: blacksmith-4vcpu-ubuntu-2404
    env:
      ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        # not --frozen-lockfile: Bun's frozen check false-positives on this
        # monorepo even on a freshly generated lockfile (matches release.yml).
        run: bun install

      - name: Typecheck
        run: bun run typecheck

      - name: Test
        run: bun run test
