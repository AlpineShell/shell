name: Claude Code Review

on:
  pull_request:
    types: [opened, synchronize]

permissions:
  contents: read
  pull-requests: write
  issues: write
  id-token: write

concurrency:
  group: claude-review-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  review:
    runs-on: blacksmith-4vcpu-ubuntu-2404
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Claude code review
        id: review
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          plugin_marketplaces: "https://github.com/anthropics/claude-code.git"
          plugins: "code-review@claude-code-plugins"
          prompt: "/code-review:code-review --comment ${{ github.repository }}/pull/${{ github.event.pull_request.number }}"
          classify_inline_comments: false

      - name: Triage review threads
        if: steps.review.outcome == 'success'
        env:
          GH_TOKEN: ${{ github.token }}
          OWNER: ${{ github.repository_owner }}
          REPO: ${{ github.event.repository.name }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail

          # The review action posts its own top-level "## Code review" summary comment
          # (author claude[bot], no marker) whenever there is reviewable code. This
          # workflow owns the single marker-tagged summary via upsert_summary below, so
          # delete the action's copy to avoid two identical comments on every code PR.
          # Inline finding comments are review-thread comments (a different endpoint) and
          # are left untouched.
          gh api --paginate "repos/$OWNER/$REPO/issues/$PR/comments" \
            --jq '.[] | select((.user.login | test("claude"; "i")) and (.body | startswith("## Code review")) and ((.body | contains("<!-- claude-review-summary -->")) | not)) | .id' \
            | while IFS= read -r dupe_id; do
                [ -z "$dupe_id" ] && continue
                gh api -X DELETE "repos/$OWNER/$REPO/issues/comments/$dupe_id" >/dev/null \
                  && echo "Removed the action's duplicate summary comment $dupe_id." \
                  || echo "::warning::Could not delete duplicate summary comment $dupe_id."
              done

          upsert_summary() {
            existing=$(gh api --paginate "repos/$OWNER/$REPO/issues/$PR/comments" \
              --jq '.[] | select(.body | contains("<!-- claude-review-summary -->")) | .id' | head -n1)
            if [ -n "$existing" ]; then
              gh api -X PATCH "repos/$OWNER/$REPO/issues/comments/$existing" -f body="$1" >/dev/null \
                && echo "Updated review summary comment." \
                || echo "::warning::Could not update summary comment."
            else
              gh api "repos/$OWNER/$REPO/issues/$PR/comments" -f body="$1" >/dev/null \
                && echo "Posted review summary comment." \
                || echo "::warning::Could not post summary comment."
            fi
          }

          reviewed=true
          changed=$(gh api --paginate "repos/$OWNER/$REPO/pulls/$PR/files" --jq '.[].filename')
          case $'\n'"$changed"$'\n' in
            *$'\n.github/workflows/claude-code-review.yml\n'*)
              reviewed=false
              echo "This PR modifies the review workflow, so the review action self-skips; no summary will be posted." ;;
          esac

          threads_json="$(gh api graphql -F o="$OWNER" -F r="$REPO" -F n="$PR" -f query='
            query($o:String!, $r:String!, $n:Int!) {
              repository(owner:$o, name:$r) {
                pullRequest(number:$n) {
                  reviewThreads(first:100) {
                    nodes { id isResolved isOutdated comments(first:1) { nodes { author { login } } } }
                    pageInfo { hasNextPage }
                  }
                }
              }
            }')"

          if [ "$(echo "$threads_json" | jq -r '.data.repository.pullRequest.reviewThreads.pageInfo.hasNextPage')" = "true" ]; then
            echo "::warning::More than 100 review threads on this PR; only the first 100 were triaged."
          fi

          bot_threads() {
            echo "$threads_json" | jq -c '
              .data.repository.pullRequest.reviewThreads.nodes[]
              | select((.comments.nodes[0].author.login // "") | test("claude"; "i"))'
          }

          resolved=0
          while IFS= read -r tid; do
            [ -z "$tid" ] && continue
            if gh api graphql -f id="$tid" -f query='
              mutation($id:ID!){ resolveReviewThread(input:{threadId:$id}){ thread { isResolved } } }' >/dev/null; then
              resolved=$((resolved + 1))
            else
              echo "::warning::Could not resolve thread $tid"
            fi
          done < <(bot_threads | jq -r 'select(.isOutdated and (.isResolved | not)) | .id')
          echo "Resolved $resolved fixed (outdated) finding thread(s)."

          open=$(bot_threads | jq -s '[.[] | select((.isOutdated | not) and (.isResolved | not))] | length')
          echo "Open findings on the current commit: $open"

          reviews=$(gh api "repos/$OWNER/$REPO/pulls/$PR/reviews?per_page=100")
          outstanding=$(echo "$reviews" | jq '[.[] | select(.user.login == "github-actions[bot]" and .state == "CHANGES_REQUESTED")] | length')

          if [ "$open" -gt 0 ]; then
            if [ "$reviewed" = true ]; then upsert_summary "$(printf '<!-- claude-review-summary -->\n## Code review\n\nFound %s issue(s) - see the inline comments.' "$open")"; fi
            if [ "$outstanding" -eq 0 ]; then
              gh api "repos/$OWNER/$REPO/pulls/$PR/reviews" \
                -f event=REQUEST_CHANGES \
                -f body="Claude review found $open unresolved issue(s) - see the inline comments. This review clears automatically once they are addressed on the next push." >/dev/null \
                && echo "Requested changes." \
                || echo "::warning::Could not submit REQUEST_CHANGES review."
            else
              echo "Changes already requested; leaving the existing review in place."
            fi
          else
            echo "$reviews" \
              | jq -r '.[] | select(.user.login == "github-actions[bot]" and .state == "CHANGES_REQUESTED") | .id' \
              | while IFS= read -r id; do
                  [ -z "$id" ] && continue
                  gh api -X PUT "repos/$OWNER/$REPO/pulls/$PR/reviews/$id/dismissals" \
                    -f message="Resolved - no outstanding findings on the latest commit." >/dev/null \
                    && echo "Dismissed prior change-request $id." \
                    || echo "::warning::Could not dismiss review $id."
                done
            if [ "$reviewed" = true ]; then upsert_summary $'<!-- claude-review-summary -->\n## Code review\n\nNo issues found. Checked for bugs and CLAUDE.md compliance.'; fi
            echo "No open findings; did not approve."
          fi
