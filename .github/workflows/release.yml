name: Release

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  build-and-publish:
    runs-on: blacksmith-4vcpu-windows-2025
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.12

      - name: Validate release tag is strict semver
        shell: bash
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          if ! [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Tag '${GITHUB_REF_NAME}' is not a strict MAJOR.MINOR.PATCH version (got '${VERSION}')."
            echo "::error::electron-updater compares with semver: 4 segments (e.g. 0.1.20260602.2) get mangled into a lower/pre-release version and clients will not update."
            echo "::error::Use a 3-segment tag that is strictly greater than the last release, e.g. v0.1.20260603 or, for multiple builds per day, encode the build into the patch: v0.1.2026060201."
            exit 1
          fi

      - name: Set version from release tag
        working-directory: apps/desktop
        shell: bash
        # Not `npm version`: this is a Bun workspace and apps/desktop depends on
        # internal packages via `workspace:*`, a protocol npm cannot parse
        # (EUNSUPPORTEDPROTOCOL). The tag is already validated as strict semver
        # above, so write the version field directly.
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          node -e "const fs=require('fs');const p=JSON.parse(fs.readFileSync('package.json','utf8'));p.version='${VERSION}';fs.writeFileSync('package.json',JSON.stringify(p,null,2)+'\n');"

      - name: Install dependencies
        shell: bash
        run: |
          bun install && exit 0
          echo "::warning::bun install failed, retrying..."
          bun install && exit 0
          echo "::warning::bun install failed again, retrying with a clean node_modules..."
          rm -rf node_modules
          bun install

      - name: Build SDK
        run: bun run sdk:build

      - name: Bake licence config
        working-directory: apps/desktop
        shell: bash
        env:
          ALPINE_RELEASE_BUILD: '1'
          ALPINE_LICENCE_PUBLIC_KEYS: ${{ secrets.ALPINE_LICENCE_PUBLIC_KEYS }}
          ALPINE_MARKETPLACE_PUBKEY: ${{ secrets.ALPINE_MARKETPLACE_PUBKEY }}
          ALPINE_AUTH_BASE: ${{ vars.ALPINE_AUTH_BASE }}
          ALPINE_WEBSITE_BASE: ${{ vars.ALPINE_WEBSITE_BASE }}
        run: node scripts/generateLicenceConfig.js

      - name: Verify the baked licence config
        working-directory: apps/desktop
        shell: bash
        run: |
          test -f electron/licenceConfig.generated.js || { echo "::error::electron/licenceConfig.generated.js was not written"; exit 1; }
          node -e "const c=require('./electron/licenceConfig.generated.js');const kids=(c.publicKeys||[]).map(k=>k&&k.kid).filter(Boolean);if(c.isReleaseBuild!==true||kids.length===0){console.error('::error::licence config must be a release build with at least one kid');process.exit(1)}console.log('licence kids: '+kids.join(', '))"
          test -f electron/marketplacePublicKey.generated.js || { echo "::error::electron/marketplacePublicKey.generated.js was not written"; exit 1; }
          node -e "const k=require('./electron/marketplacePublicKey.generated.js');if(typeof k.publicKeyPem!=='string'){console.log('::warning::no marketplace public key baked; set the ALPINE_MARKETPLACE_PUBKEY secret so this build can verify plugin signatures');process.exit(0)}console.log('marketplace public key baked')"

      - name: Build installer
        working-directory: apps/desktop
        shell: bash
        run: |
          bunx vite build
          bunx electron-builder --win --publish never

      - name: Verify the baked update feed
        working-directory: apps/desktop
        shell: bash
        run: |
          FEED="$(node -e "console.log(require('./package.json').build.publish.url)")"
          test -f release/win-unpacked/resources/app-update.yml || { echo "::error::app-update.yml was not written"; exit 1; }
          grep -F "url: $FEED" release/win-unpacked/resources/app-update.yml || { echo "::error::app-update.yml does not point at $FEED"; cat release/win-unpacked/resources/app-update.yml; exit 1; }
          echo "update feed: $FEED"

      - name: Verify Electron fuses
        working-directory: apps/desktop
        shell: bash
        run: |
          FUSE_REPORT="$(bunx electron-fuses read --app "release/win-unpacked/Alpine Shell.exe" | sed -e $'s/\x1b\\[[0-9;]*m//g')"
          echo "$FUSE_REPORT"
          assertFuse() {
            if ! grep -qE "^[[:space:]]*$1 is $2$" <<< "$FUSE_REPORT"; then
              echo "::error::Expected fuse $1 to be $2 in the packaged executable."
              echo "::error::The packaged build is not hardened; check build.electronFuses in apps/desktop/package.json."
              exit 1
            fi
          }
          assertFuse RunAsNode Disabled
          assertFuse EnableCookieEncryption Enabled
          assertFuse EnableNodeOptionsEnvironmentVariable Disabled
          assertFuse EnableNodeCliInspectArguments Disabled
          assertFuse EnableEmbeddedAsarIntegrityValidation Enabled
          assertFuse OnlyLoadAppFromAsar Enabled

      - name: Publish installer + latest.yml to Railway
        working-directory: apps/desktop
        env:
          STORAGE_ENDPOINT: ${{ secrets.STORAGE_ENDPOINT }}
          STORAGE_REGION: ${{ secrets.STORAGE_REGION }}
          STORAGE_ACCESS_KEY_ID: ${{ secrets.STORAGE_ACCESS_KEY_ID }}
          STORAGE_SECRET_ACCESS_KEY: ${{ secrets.STORAGE_SECRET_ACCESS_KEY }}
          STORAGE_BUCKET: ${{ secrets.STORAGE_BUCKET }}
          STORAGE_FORCE_PATH_STYLE: ${{ secrets.STORAGE_FORCE_PATH_STYLE }}
        run: node scripts/publish.js

      - name: Attach installer to GitHub Release
        shell: bash
        run: gh release upload "${GITHUB_REF_NAME}" apps/desktop/release/*.exe --clobber
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
