name: Release

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    uses: ./.github/workflows/ci.yml

  build-and-publish:
    needs: verify
    runs-on: blacksmith-4vcpu-windows-2025
    env:
      SIGN_WINDOWS_BINARIES: ${{ secrets.WIN_CSC_LINK != '' }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.12

      - name: Validate release tag and pick the channel
        shell: bash
        env:
          MARKED_PRERELEASE: ${{ github.event.release.prerelease == true }}
        run: |
          if [ "$GITHUB_REF_TYPE" != "tag" ]; then
            echo "::error::Run this workflow on a release tag, not on '${GITHUB_REF_NAME}'."
            exit 1
          fi
          VERSION="${GITHUB_REF_NAME#v}"
          if [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "FEED_CHANNEL=latest" >> "$GITHUB_ENV"
            if [ "$MARKED_PRERELEASE" = "true" ]; then
              echo "PUBLISH_TO_FEED=false" >> "$GITHUB_ENV"
            else
              echo "PUBLISH_TO_FEED=true" >> "$GITHUB_ENV"
            fi
          elif [[ "$VERSION" =~ ^0\.[0-9]{8}\.[0-9]+$ ]]; then
            echo "FEED_CHANNEL=latest" >> "$GITHUB_ENV"
            echo "PUBLISH_TO_FEED=true" >> "$GITHUB_ENV"
          elif [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+-nightly\.[0-9]{8}\.[0-9]+$ ]]; then
            echo "FEED_CHANNEL=nightly" >> "$GITHUB_ENV"
            echo "PUBLISH_TO_FEED=true" >> "$GITHUB_ENV"
          else
            echo "::error::Tag '${GITHUB_REF_NAME}' is neither a stable MAJOR.MINOR.PATCH version, the date-numbered bridge 0.YYYYMMDD.N, nor a nightly MAJOR.MINOR.PATCH-nightly.YYYYMMDD.N version (got '${VERSION}')."
            echo "::error::electron-updater compares with semver, so a stable tag must be greater than the last stable release, e.g. v1.0.0 then v1.0.1."
            exit 1
          fi

      - name: Set version from release tag
        working-directory: apps/desktop
        shell: bash
        # Not `npm version`: this is a Bun workspace and apps/desktop depends on
        # internal packages via `workspace:*`, a protocol npm cannot parse
        # (EUNSUPPORTEDPROTOCOL). The tag is already validated as strict semver
        # above, so write the version field directly.
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          node -e "const fs=require('fs');const p=JSON.parse(fs.readFileSync('package.json','utf8'));p.version='${VERSION}';fs.writeFileSync('package.json',JSON.stringify(p,null,2)+'\n');"

      - name: Install dependencies
        shell: bash
        run: |
          bun install --frozen-lockfile && exit 0
          echo "::warning::bun install failed, retrying..."
          bun install --frozen-lockfile && exit 0
          echo "::warning::bun install failed again, retrying with a clean node_modules..."
          rm -rf node_modules
          bun install --frozen-lockfile

      - name: Build SDK
        run: bun run sdk:build

      - name: Bake marketplace base
        working-directory: apps/desktop
        shell: bash
        env:
          ALPINE_PLUGINS_BASE: ${{ vars.ALPINE_PLUGINS_BASE }}
        run: |
          node scripts/generateMarketplaceConfig.js
          node -e "const c=require('./electron/marketplaceConfig.generated.js');if(c.pluginsBase&&!/^https:\/\//i.test(c.pluginsBase)){console.error('::error::the marketplace base must be https, a release build ignores anything else');process.exit(1)}console.log('marketplace base: '+(c.pluginsBase||'built-in default'))"

      - name: Bake licence config
        working-directory: apps/desktop
        shell: bash
        env:
          ALPINE_RELEASE_BUILD: '1'
          ALPINE_LICENCE_PUBLIC_KEYS: ${{ secrets.ALPINE_LICENCE_PUBLIC_KEYS }}
          ALPINE_MARKETPLACE_PUBKEY: ${{ secrets.ALPINE_MARKETPLACE_PUBKEY }}
          ALPINE_AUTH_BASE: ${{ vars.ALPINE_AUTH_BASE }}
          ALPINE_WEBSITE_BASE: ${{ vars.ALPINE_WEBSITE_BASE }}
        run: node scripts/generateLicenceConfig.js

      - name: Verify the baked licence config
        working-directory: apps/desktop
        shell: bash
        run: |
          test -f electron/licenceConfig.generated.js || { echo "::error::electron/licenceConfig.generated.js was not written"; exit 1; }
          node -e "const c=require('./electron/licenceConfig.generated.js');const kids=(c.publicKeys||[]).map(k=>k&&k.kid).filter(Boolean);if(c.isReleaseBuild!==true||kids.length===0){console.error('::error::licence config must be a release build with at least one kid');process.exit(1)}if(!String(c.authBase).startsWith('https://')||!String(c.websiteBase).startsWith('https://')){console.error('::error::licence config must use https for the auth and website bases');process.exit(1)}console.log('licence kids: '+kids.join(', ')+', auth '+c.authBase+', website '+c.websiteBase)"
          test -f electron/marketplacePublicKey.generated.js || { echo "::error::electron/marketplacePublicKey.generated.js was not written"; exit 1; }
          node -e "const k=require('./electron/marketplacePublicKey.generated.js');if(typeof k.publicKeyPem!=='string'||!k.publicKeyPem.includes('BEGIN PUBLIC KEY')){console.error('::error::no marketplace public key baked; set the ALPINE_MARKETPLACE_PUBKEY secret, a release build refuses every plugin it cannot verify');process.exit(1)}console.log('marketplace public key baked')"

      - name: Setup Rust
        shell: bash
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable

      - name: Build native add-on
        working-directory: apps/desktop
        shell: bash
        run: node scripts/buildNative.js

      - name: Build renderer
        working-directory: apps/desktop
        shell: bash
        run: bunx vite build

      - name: Build installer
        working-directory: apps/desktop
        shell: bash
        env:
          WIN_CSC_LINK: ${{ secrets.WIN_CSC_LINK }}
          WIN_CSC_KEY_PASSWORD: ${{ secrets.WIN_CSC_KEY_PASSWORD }}
        run: |
          if [ "$SIGN_WINDOWS_BINARIES" = "true" ]; then
            bunx electron-builder --win --publish never -c.publish.channel="$FEED_CHANNEL" -c.forceCodeSigning=true
          else
            echo "::warning::WIN_CSC_LINK is not set, so the installer and every file it installs are unsigned."
            bunx electron-builder --win --publish never -c.publish.channel="$FEED_CHANNEL"
          fi
          test -f "release/$FEED_CHANNEL.yml" || { echo "::error::electron-builder did not write release/$FEED_CHANNEL.yml"; exit 1; }

      - name: Verify the baked update feed
        working-directory: apps/desktop
        shell: bash
        run: |
          FEED="$(node -e "console.log(require('./package.json').build.publish.url)")"
          test -f release/win-unpacked/resources/app-update.yml || { echo "::error::app-update.yml was not written"; exit 1; }
          grep -F "url: $FEED" release/win-unpacked/resources/app-update.yml || { echo "::error::app-update.yml does not point at $FEED"; cat release/win-unpacked/resources/app-update.yml; exit 1; }
          echo "update feed: $FEED"

      - name: Verify the native add-on is packaged
        working-directory: apps/desktop
        shell: bash
        run: |
          test -f release/win-unpacked/resources/app.asar.unpacked/electron/native/alpine_native.node || { echo "::error::alpine_native.node is missing from app.asar.unpacked"; exit 1; }
          echo "native add-on packaged"

      - name: Verify koffi is packaged
        working-directory: apps/desktop
        shell: bash
        run: |
          test -f release/win-unpacked/resources/app.asar.unpacked/node_modules/@koromix/koffi-win32-x64/win32_x64/koffi.node || { echo "::error::koffi.node is missing from app.asar.unpacked"; exit 1; }
          bunx @electron/asar list release/win-unpacked/resources/app.asar | grep -qE '[\\/]node_modules[\\/]koffi[\\/]src[\\/]koffi[\\/]index\.cjs' || { echo "::error::the koffi loader is missing from app.asar"; exit 1; }
          echo "koffi packaged"

      - name: Verify Electron fuses
        working-directory: apps/desktop
        shell: bash
        run: |
          FUSE_REPORT="$(bunx electron-fuses read --app "release/win-unpacked/Alpine Shell.exe" | sed -e $'s/\x1b\\[[0-9;]*m//g')"
          echo "$FUSE_REPORT"
          assertFuse() {
            if ! grep -qE "^[[:space:]]*$1 is $2$" <<< "$FUSE_REPORT"; then
              echo "::error::Expected fuse $1 to be $2 in the packaged executable."
              echo "::error::The packaged build is not hardened; check build.electronFuses in apps/desktop/package.json."
              exit 1
            fi
          }
          assertFuse RunAsNode Disabled
          assertFuse EnableCookieEncryption Enabled
          assertFuse EnableNodeOptionsEnvironmentVariable Disabled
          assertFuse EnableNodeCliInspectArguments Disabled
          assertFuse EnableEmbeddedAsarIntegrityValidation Enabled
          assertFuse OnlyLoadAppFromAsar Enabled

      - name: Verify code signatures
        if: env.SIGN_WINDOWS_BINARIES == 'true'
        working-directory: apps/desktop
        shell: pwsh
        run: |
          $files = @(Get-ChildItem -Path release/win-unpacked -Recurse -File -Include *.exe, *.dll, *.node) + @(Get-ChildItem -Path release -File -Filter *.exe)
          $notSigned = @($files | Where-Object { (Get-AuthenticodeSignature -LiteralPath $_.FullName).Status -ne 'Valid' })
          foreach ($file in $notSigned) { Write-Output "::error::$($file.FullName) does not carry a valid signature." }
          if ($notSigned.Count -gt 0) { exit 1 }
          Write-Output "$($files.Count) files carry a valid signature."

      - name: Scan the installer with Microsoft Defender
        working-directory: apps/desktop
        shell: pwsh
        run: ./scripts/scanInstaller.ps1 -InstallerDirectory release

      - name: Keep the installer for the release
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: installer
          path: apps/desktop/release/*.exe
          if-no-files-found: error
          retention-days: 1
          compression-level: 0
          overwrite: true

      - name: Publish installer + update feed to Railway
        if: env.PUBLISH_TO_FEED == 'true'
        working-directory: apps/desktop
        env:
          STORAGE_ENDPOINT: ${{ secrets.STORAGE_ENDPOINT }}
          STORAGE_REGION: ${{ secrets.STORAGE_REGION }}
          STORAGE_ACCESS_KEY_ID: ${{ secrets.STORAGE_ACCESS_KEY_ID }}
          STORAGE_SECRET_ACCESS_KEY: ${{ secrets.STORAGE_SECRET_ACCESS_KEY }}
          STORAGE_BUCKET: ${{ secrets.STORAGE_BUCKET }}
          STORAGE_FORCE_PATH_STYLE: ${{ secrets.STORAGE_FORCE_PATH_STYLE }}
        run: node scripts/publish.js

  attach-to-release:
    needs: build-and-publish
    runs-on: blacksmith-4vcpu-ubuntu-2404
    permissions:
      contents: write
    steps:
      - name: Download the installer
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: installer
          path: installer

      - name: Attach installer to GitHub Release
        shell: bash
        run: gh release upload "${GITHUB_REF_NAME}" installer/*.exe --clobber
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
