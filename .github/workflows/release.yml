name: Release

on:
  release:
    types: [published]

permissions:
  contents: write

# --- Storage / update channel configuration ---
# Primary store is Railway/MinIO (STORAGE_* secrets). Installers bake the Railway
# update URL by default (apps/desktop/package.json build.publish.url), so new
# builds check Railway with no per-release config.
#   * STORAGE_* secrets    -> installer + latest.yml upload to Railway/MinIO
#   * UPDATE_PUBLIC_URL var -> optional override of the baked update URL
# R2 is kept ONLY as a one-time migration path for installs that still check R2
# (the URL baked into older builds). Set the repo variable DUAL_PUBLISH_R2=true to
# ALSO push this (Railway-pointing) release to R2 so those copies receive it and
# roll over onto Railway. Drop the variable and the R2_* secrets once the
# installed base has migrated; then R2 can be decommissioned.

jobs:
  build-and-publish:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.12

      - name: Validate release tag is strict semver
        shell: bash
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          if ! [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Tag '${GITHUB_REF_NAME}' is not a strict MAJOR.MINOR.PATCH version (got '${VERSION}')."
            echo "::error::electron-updater compares with semver: 4 segments (e.g. 0.1.20260602.2) get mangled into a lower/pre-release version and clients will not update."
            echo "::error::Use a 3-segment tag that is strictly greater than the last release, e.g. v0.1.20260603 or, for multiple builds per day, encode the build into the patch: v0.1.2026060201."
            exit 1
          fi

      - name: Set version from release tag
        working-directory: apps/desktop
        shell: bash
        run: npm version "${GITHUB_REF_NAME#v}" --no-git-tag-version --allow-same-version

      - name: Install dependencies
        shell: bash
        run: |
          bun install && exit 0
          echo "::warning::bun install failed, retrying..."
          bun install && exit 0
          echo "::warning::bun install failed again, retrying with a clean node_modules..."
          rm -rf node_modules
          bun install

      - name: Build SDK
        run: bun run sdk:build

      - name: Build installer
        working-directory: apps/desktop
        shell: bash
        env:
          ALPINE_GOOGLE_CLIENT_ID: ${{ secrets.ALPINE_GOOGLE_CLIENT_ID }}
          ALPINE_GOOGLE_CLIENT_SECRET: ${{ secrets.ALPINE_GOOGLE_CLIENT_SECRET }}
          UPDATE_PUBLIC_URL: ${{ vars.UPDATE_PUBLIC_URL }}
        run: |
          node scripts/generateGoogleCredentials.js
          bunx vite build
          EXTRA=""
          if [ -n "$UPDATE_PUBLIC_URL" ]; then
            echo "Baking update URL: $UPDATE_PUBLIC_URL"
            EXTRA="-c.publish.url=$UPDATE_PUBLIC_URL"
          fi
          bunx electron-builder --win --publish never $EXTRA

      - name: Publish installer + latest.yml to Railway
        working-directory: apps/desktop
        env:
          STORAGE_ENDPOINT: ${{ secrets.STORAGE_ENDPOINT }}
          STORAGE_REGION: ${{ secrets.STORAGE_REGION }}
          STORAGE_ACCESS_KEY_ID: ${{ secrets.STORAGE_ACCESS_KEY_ID }}
          STORAGE_SECRET_ACCESS_KEY: ${{ secrets.STORAGE_SECRET_ACCESS_KEY }}
          STORAGE_BUCKET: ${{ secrets.STORAGE_BUCKET }}
          STORAGE_FORCE_PATH_STYLE: ${{ secrets.STORAGE_FORCE_PATH_STYLE }}
          STORAGE_PUBLIC_URL: ${{ vars.UPDATE_PUBLIC_URL }}
        run: node scripts/publish.js

      # One-time migration: mirror this Railway-pointing release to R2 so installs
      # that still check R2 pick it up and roll onto Railway. Remove DUAL_PUBLISH_R2
      # (and the R2_* secrets) once the installed base has migrated.
      - name: One-time R2 dual-publish (migrate installs still checking R2)
        if: ${{ vars.DUAL_PUBLISH_R2 == 'true' }}
        working-directory: apps/desktop
        env:
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
        run: node scripts/publish.js

      - name: Attach installer to GitHub Release
        shell: bash
        run: gh release upload "${GITHUB_REF_NAME}" apps/desktop/release/*.exe --clobber
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
