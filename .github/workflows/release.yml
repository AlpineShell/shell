name: Release

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  build-and-publish:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Validate release tag is strict semver
        shell: bash
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          if ! [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Tag '${GITHUB_REF_NAME}' is not a strict MAJOR.MINOR.PATCH version (got '${VERSION}')."
            echo "::error::electron-updater compares with semver: 4 segments (e.g. 0.1.20260602.2) get mangled into a lower/pre-release version and clients will not update."
            echo "::error::Use a 3-segment tag that is strictly greater than the last release, e.g. v0.1.20260603 or, for multiple builds per day, encode the build into the patch: v0.1.2026060201."
            exit 1
          fi

      - name: Set version from release tag
        working-directory: apps/desktop
        shell: bash
        run: npm version "${GITHUB_REF_NAME#v}" --no-git-tag-version --allow-same-version

      - name: Install dependencies
        run: bun install

      - name: Build and publish to R2
        run: bun run release
        env:
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}

      - name: Attach installer to GitHub Release
        shell: bash
        run: gh release upload "${GITHUB_REF_NAME}" apps/desktop/release/*.exe --clobber
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
