name: Release

on:
  release:
    types: [published]

permissions:
  contents: write

# --- Storage / update channel configuration ---
# Uploads go to whichever store is configured. The publish scripts prefer the
# generic STORAGE_* secrets and fall back to the legacy R2_* secrets, so:
#   * set STORAGE_* secrets  -> artifacts upload to Railway/MinIO
#   * leave only R2_* secrets -> artifacts upload to Cloudflare R2 (unchanged)
# The URL installed apps CHECK for updates is baked into the installer at build
# time. Set the repo variable UPDATE_PUBLIC_URL to override it (point new builds
# at Railway); leave it unset to keep package.json's default (R2).
# During the transition, set the repo variable DUAL_PUBLISH_R2=true to ALSO push
# the same installer + latest.yml to R2 so already-installed copies (which still
# check R2) receive this release and roll over onto a Railway-pointing build.

jobs:
  build-and-publish:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.12

      - name: Validate release tag is strict semver
        shell: bash
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          if ! [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Tag '${GITHUB_REF_NAME}' is not a strict MAJOR.MINOR.PATCH version (got '${VERSION}')."
            echo "::error::electron-updater compares with semver: 4 segments (e.g. 0.1.20260602.2) get mangled into a lower/pre-release version and clients will not update."
            echo "::error::Use a 3-segment tag that is strictly greater than the last release, e.g. v0.1.20260603 or, for multiple builds per day, encode the build into the patch: v0.1.2026060201."
            exit 1
          fi

      - name: Set version from release tag
        working-directory: apps/desktop
        shell: bash
        run: npm version "${GITHUB_REF_NAME#v}" --no-git-tag-version --allow-same-version

      - name: Install dependencies
        shell: bash
        run: |
          bun install && exit 0
          echo "::warning::bun install failed, retrying..."
          bun install && exit 0
          echo "::warning::bun install failed again, retrying with a clean node_modules..."
          rm -rf node_modules
          bun install

      - name: Build SDK
        run: bun run sdk:build

      - name: Build installer
        working-directory: apps/desktop
        shell: bash
        env:
          ALPINE_GOOGLE_CLIENT_ID: ${{ secrets.ALPINE_GOOGLE_CLIENT_ID }}
          ALPINE_GOOGLE_CLIENT_SECRET: ${{ secrets.ALPINE_GOOGLE_CLIENT_SECRET }}
          UPDATE_PUBLIC_URL: ${{ vars.UPDATE_PUBLIC_URL }}
        run: |
          node scripts/generateGoogleCredentials.js
          bunx vite build
          EXTRA=""
          if [ -n "$UPDATE_PUBLIC_URL" ]; then
            echo "Baking update URL: $UPDATE_PUBLIC_URL"
            EXTRA="-c.publish.url=$UPDATE_PUBLIC_URL"
          fi
          bunx electron-builder --win --publish never $EXTRA

      - name: Publish installer to object store (Railway if STORAGE_* set, else R2)
        working-directory: apps/desktop
        env:
          STORAGE_ENDPOINT: ${{ secrets.STORAGE_ENDPOINT }}
          STORAGE_REGION: ${{ secrets.STORAGE_REGION }}
          STORAGE_ACCESS_KEY_ID: ${{ secrets.STORAGE_ACCESS_KEY_ID }}
          STORAGE_SECRET_ACCESS_KEY: ${{ secrets.STORAGE_SECRET_ACCESS_KEY }}
          STORAGE_BUCKET: ${{ secrets.STORAGE_BUCKET }}
          STORAGE_FORCE_PATH_STYLE: ${{ secrets.STORAGE_FORCE_PATH_STYLE }}
          STORAGE_PUBLIC_URL: ${{ vars.UPDATE_PUBLIC_URL }}
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
        run: node scripts/publish.js

      - name: Transition dual-publish to R2 (existing installs roll over)
        if: ${{ vars.DUAL_PUBLISH_R2 == 'true' }}
        working-directory: apps/desktop
        env:
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
        run: node scripts/publish.js

      - name: Attach installer to GitHub Release
        shell: bash
        run: gh release upload "${GITHUB_REF_NAME}" apps/desktop/release/*.exe --clobber
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
